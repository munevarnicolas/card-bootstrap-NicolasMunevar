<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tarjeta Personal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>

        body 
        {
            background-color: #65abea;
            padding: 50px;
        }

        .mi-tarjeta 
        {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            margin: auto;
        }

        .mi-foto 
        {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #65abea;
        }

        .mi-nombre 
        {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }

        .mi-rol 
        {
            color: #65abea;
            font-size: 18px;
            margin-top: 10px;
        }

        .mi-descripcion 
        {
            color: #999;
            margin-top: 20px;
            margin-bottom: 30px;
        }

    
        .mis-botones 
        {
            margin-top: 20px;
        }

        .mis-botones .btn {
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="mi-tarjeta">
        
    
        <img src= imagenes/FotoPerfil.jpg class="mi-foto" alt="Mi foto">
        
        <h1 class="mi-nombre">Nicolás Munevar</h1>
        
  
        <p class="mi-rol">Desarrollador Fullstack</p>
        

        <p class="mi-descripcion">
            
        </p>
        
     
        <div class="mis-botones">
            
            <a href="https://www.linkedin.com/in/munevarnicolas/" class="btn btn-primary">
                <i class="bi bi-linkedin"></i> LinkedIn
            </a>
            
            <a href="https://github.com/munevarnicolas" class="btn btn-dark">
                <i class="bi bi-github"></i> GitHub
            </a>
            
        
            <a href="mailto:munevarnicolas@hotmail.com" class="btn btn-danger">
                <i class="bi bi-envelope"></i> Email
            </a>
            
        </div>
        
    </div>

</body>
</html>
